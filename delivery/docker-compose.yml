services:
  db:
    image: mysql:8.0
    container_name: delivery_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "delivery_user",
             "-p${MYSQL_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: delivery_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  redis:
    image: redis:latest
    container_name: delivery_redis
    ports:
        - "6379:6379"

  web:
    build: .
    container_name: delivery_web
    command: ["bash", "-c", "python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "8000:8000"
    env_file:
       - .env
    depends_on:
      - db
      - redis
      - rabbitmq
    volumes:
      - .:/app

  celery:
    build: .
    container_name: delivery_celery
    command: celery -A config worker -l INFO
    env_file:
       - .env
    depends_on:
      - rabbitmq
      - redis
      - db
    volumes:
      - .:/app

volumes:
    db_data:

networks:
  delivery_network:
    driver: bridge
